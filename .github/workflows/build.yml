name: AUR binary repository

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "packages.txt"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    # Daily build to pick up AUR updates.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild all packages (ignore the cache)"
        type: boolean
        default: false
      skip_pgp:
        description: "Skip PGP signatures of sources (--skippgpcheck)"
        type: boolean
        default: false
      nocheck:
        description: "Do not run check() (--nocheck)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time: the published repository is a global state.
concurrency:
  group: aur-bin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_REBUILD: ${{ inputs.force == true && '1' || '0' }}
      SKIP_PGP_CHECK: ${{ inputs.skip_pgp == true && '1' || '0' }}
      NO_CHECK: ${{ inputs.nocheck == true && '1' || '0' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: pacman -Syu --noconfirm --needed archlinux-keyring git curl sudo

      - name: Create the build user
        # makepkg refuses to run as root: build as `builder` with
        # passwordless sudo for --syncdeps.
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Discover the PKGBUILDs
        id: discover
        # sudo strips $GITHUB_OUTPUT, so the script writes .ci/count instead.
        run: sudo -u builder -H env GITHUB_ACTIONS=true bash scripts/discover.sh

      - name: Read the discovery result
        id: meta
        run: echo "count=$(cat .ci/count 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Restore already built binaries
        if: steps.meta.outputs.count != '0'
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: pkgcache
          key: pkgs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pkgs-

      - name: Hand over to the build user
        if: steps.meta.outputs.count != '0'
        run: |
          set -euo pipefail
          if [[ -d pkgcache ]]; then chown -R builder:builder pkgcache; fi

      - name: Build the packages
        if: steps.meta.outputs.count != '0'
        id: build
        run: sudo -u builder -H env GITHUB_ACTIONS=true bash scripts/build.sh

      - name: Read the build result
        if: steps.meta.outputs.count != '0'
        id: result
        run: echo "rebuilt=$(cat .ci/rebuilt 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Cache the binaries
        if: steps.meta.outputs.count != '0' && steps.result.outputs.rebuilt == 'true'
        uses: actions/cache/save@v6
        with:
          path: pkgcache
          key: pkgs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the repository as an artifact
        if: steps.meta.outputs.count != '0'
        uses: actions/upload-artifact@v6
        with:
          name: repo-pacman
          path: repo/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: steps.meta.outputs.count != '0'
        uses: actions/configure-pages@v6

      - name: Package the repository for Pages
        if: steps.meta.outputs.count != '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - name: Deploy to Pages
        if: steps.meta.outputs.count != '0'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        if: always()
        run: |
          if [[ -s .ci/failures.txt ]]; then
            n="$(wc -l < .ci/failures.txt)"
            echo "::error::${n} package(s) could not be built — their version is not published."
            sed 's/^/  - /' .ci/failures.txt
            exit 1
          fi
          echo "All packages were built."
