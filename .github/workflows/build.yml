name: AUR binary repository

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "packages.txt"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    # Daily build to pick up AUR updates.
    - cron: "30 4 * * *"
  pull_request:
    # Validation only: a PR builds but never deploys (see the deploy job).
    branches: [main, master]
    paths:
      - "packages/**"
      - "packages.txt"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild all packages (ignore the cache)"
        type: boolean
        default: false
      skip_pgp:
        description: "Skip PGP signatures of sources (--skippgpcheck)"
        type: boolean
        default: false
      nocheck:
        description: "Do not run check() (--nocheck)"
        type: boolean
        default: false

# Least privilege: only the deploy job may write to Pages or mint an OIDC
# token. The build job — which executes PKGBUILDs downloaded from the
# network — keeps read-only access to the repository.
permissions:
  contents: read

# The published repository is a global state: never two builds at once for
# the same ref (push, schedule and manual runs of a branch share a group).
concurrency:
  group: aur-bin-${{ github.ref }}
  cancel-in-progress: false

# The default inside a container job is `sh -e`; the steps below use bash
# features (`[[ ]]`, `pipefail`) that only work because Arch's /bin/sh is a
# symlink to bash. Ask for bash explicitly instead of relying on that.
defaults:
  run:
    shell: bash

jobs:
  lint:
    # Static checks, no Arch container needed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q shellcheck
          fi
          shellcheck -x scripts/*.sh

      # actionlint also runs shellcheck over the run: blocks below.
      - name: actionlint
        run: |
          version=v1.7.12
          curl -fsSL --retry 3 --max-time 120 -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_amd64.tar.gz"
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # A hung download or makepkg must not occupy a runner for the default 6 h.
    timeout-minutes: 45
    outputs:
      count: ${{ steps.meta.outputs.count }}
    env:
      FORCE_REBUILD: ${{ inputs.force == true && '1' || '0' }}
      SKIP_PGP_CHECK: ${{ inputs.skip_pgp == true && '1' || '0' }}
      NO_CHECK: ${{ inputs.nocheck == true && '1' || '0' }}
      # A -git PKGBUILD is identical upstream from one day to the next:
      # refresh those on the daily run only (scripts/build.sh).
      FORCE_VCS: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The build runs downloaded PKGBUILDs as a local user: do not leave
          # the GITHUB_TOKEN in .git/config, where that code could read it.
          persist-credentials: false

      - name: Install build tools
        run: pacman -Syu --noconfirm --needed archlinux-keyring git curl sudo

      - name: Create the build user
        # makepkg refuses to run as root: build as `builder`. Its only root
        # need is `makepkg --syncdeps`, which runs `sudo pacman -S`, so
        # passwordless sudo is granted for pacman alone — not for a shell,
        # which would hand full root to any PKGBUILD.
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          printf '%s\n' 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Discover the PKGBUILDs
        id: discover
        # sudo strips $GITHUB_OUTPUT, so the script writes .ci/count instead.
        run: sudo -u builder -H env GITHUB_ACTIONS=true bash scripts/discover.sh

      - name: Read the discovery result
        id: meta
        run: echo "count=$(cat .ci/count 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Restore already built binaries
        if: steps.meta.outputs.count != '0'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pkgcache
          key: pkgs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pkgs-

      - name: Hand over to the build user
        if: steps.meta.outputs.count != '0'
        run: |
          set -euo pipefail
          if [[ -d pkgcache ]]; then chown -R builder:builder pkgcache; fi

      - name: Build the packages
        if: steps.meta.outputs.count != '0'
        id: build
        run: sudo -u builder -H env GITHUB_ACTIONS=true bash scripts/build.sh

      - name: Read the build result
        if: steps.meta.outputs.count != '0'
        id: result
        run: echo "rebuilt=$(cat .ci/rebuilt 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Cache the binaries
        if: steps.meta.outputs.count != '0' && steps.result.outputs.rebuilt == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pkgcache
          key: pkgs-${{ github.run_id }}-${{ github.run_attempt }}

      # The logs are the only way to diagnose a failing PKGBUILD once the run
      # is over: upload them even when the build step failed.
      - name: Publish the build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-logs
          path: .ci/
          if-no-files-found: warn
          # .ci is a hidden directory: upload-artifact skips hidden files
          # unless this is set.
          include-hidden-files: true
          retention-days: 14

      # Mirror of what Pages serves, for consumers that cannot use Pages.
      # Short retention: it is regenerated on every run (57 MB today) and a
      # daily build would otherwise exhaust the artifact storage quota.
      - name: Publish the repository as an artifact
        if: steps.meta.outputs.count != '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: repo-pacman
          path: repo/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      # The run summary lives in scripts/summary.sh so it can be linted and
      # run locally. It reads .ci/summary.md, .ci/failures.txt and .ci/count
      # itself; only the step outcomes have to come from the workflow.
      - name: Summary
        if: always()
        env:
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: bash scripts/summary.sh

  # Separate job on purpose: it holds the only token that can write to Pages,
  # and it runs the artifact produced by the build — never a PKGBUILD.
  deploy:
    needs: build
    if: >-
      success() && github.ref == 'refs/heads/main' &&
      needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download the repository built by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: repo-pacman
          path: repo

      - name: Package the repository for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: repo

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Housekeeping: runs no PKGBUILD, so it is the one job that may hold the
  # write permissions the build job must never see.
  maintenance:
    name: Maintenance
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # prune the build caches
      issues: write  # report failing scheduled runs
    steps:
      - name: Prune old caches
        # Every rebuild saves a full copy of pkgcache under a unique key:
        # keep the newest ones only, to stay inside the 10 GB repository
        # quota. Best effort: a pruning problem must never fail the run.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = 5;
            const res = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
              owner, repo, per_page: 100,
            });
            const pkgs = (res.data.actions_caches || [])
              .filter(c => (c.key || '').startsWith('pkgs-'))
              .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
            for (const cache of pkgs.slice(keep)) {
              core.info(`pruning cache ${cache.key} (${cache.created_at})`);
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                owner, repo, cache_id: cache.id,
              });
            }

      # Cron failures are easy to miss: GitHub only notifies the last
      # committer. Keep a single open issue and comment on it per failure.
      - name: Open an issue when the scheduled build fails
        if: github.event_name == 'schedule' && needs.build.result != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'scheduled-build-failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a' });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = the label already exists
            }
            const { data } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            });
            if (data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: data[0].number,
                body: `The scheduled build failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'Scheduled AUR build failing',
                labels: [label],
                body: `The daily build failed.\n\nRun: ${runUrl}\n\nSee the run summary for the failing package(s).`,
              });
            }
